# Book settings
title: Think Python
author: Allen B. Downey

latex:
  latex_documents:
    targetname: book.tex

execute:
  execute_notebooks: 'off'

repository:
  url: https://github.com/AllenDowney/ThinkPython/tree/v3
html:
  baseurl: https://allendowney.github.io/ThinkPython/
  use_repository_button: true

  extra_footer: |
    <div style="text-align: left;">
      <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/">
        <img alt="Creative Commons License" style="border-width:0"
             src="https://i.creativecommons.org/l/by-nc-sa/4.0/88x31.png" />
      </a>
      <br />
      This work is licensed under a
      <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/">
        Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License
      </a>.
    </div>
    <script>new Image().src="https://greenteapress.com/gh.gif?u="+encodeURIComponent(location.href)+"&r="+encodeURIComponent(document.referrer)</script>

parse:
  # myst_extended_syntax: true  # instead enable individual features below
  myst_enable_extensions:  # https://myst-parser.readthedocs.io/en/latest/using/syntax-optional.html
    - amsmath
    # - attrs_inline  # causing the conflict with dollarmath
    - colon_fence
    - deflist
    - dollarmath
    - fieldlist
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - strikethrough
    - substitution
    - tasklist

sphinx:
  # Merge html_theme_options below into the ones JB sets (repository button, search text)
  # instead of replacing them.
  recursive_update: true
  # Sitemap and link previews (GreenTeaPress plans/seo.md); page descriptions are in
  # descriptions.yml (notebooks) and the front matter of index.md and blank.md
  extra_extensions:
    - sphinx_sitemap
    - sphinxext.opengraph
  config:
    html_baseurl: https://allendowney.github.io/ThinkPython/
    sitemap_url_scheme: "{link}"
    sitemap_excludes: [genindex.html, search.html]
    ogp_site_url: https://allendowney.github.io/ThinkPython/
    ogp_site_name: Think Python, 3rd edition
    ogp_image: https://raw.githubusercontent.com/AllenDowney/ThinkPython/v3/think_python_3e.jpg
    ogp_image_alt: Cover of Think Python, 3rd edition, by Allen B. Downey
    ogp_enable_meta_description: false
    # End-of-chapter support note (_templates/support-ask.html, _static/support-ask.css).
    templates_path: [_templates]
    html_theme_options:
      article_footer_items: [support-ask.html]
      # Above "Contents": EthicalAds (_templates/ethicalads.html) or a book sponsor
      # (_templates/sponsor.html); both off until set, and only one at a time.
      secondary_sidebar_items: [ethicalads.html, sponsor.html, page-toc.html]
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    mathjax_config:
      tex2jax:
        inlineMath: [["$","$"], ["\\(", "\\)"]]
    myst_update_mathjax: false
